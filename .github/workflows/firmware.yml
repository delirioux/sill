# SPDX-License-Identifier: GPL-3.0-only
# Sill's firmware package for the FM-1, built on GitHub's Linux runners: JieLi's toolchain and three files of the
# JieLi AC79 SDK (Apache-2.0) come from JieLi's own servers, as BUILDING.md describes. The package is the run's
# artifact "sill-firmware" (Actions > the run > Artifacts). Every push also makes the site on GitHub Pages
# (web/si_make_site.py): main's release at the root, dev's test build under dev/, each with its installer; a run
# builds the other branch too, so either push publishes both. It needs Settings > Pages > Source: GitHub Actions,
# and dev allowed in the github-pages environment.
# The host tests run first.
name: Firmware

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true            # firmware/engines: Felucca-Engines (MIT)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (the UI font and icons are rasterised at build time)
        run: pip install Pillow fonttools

      - name: JieLi toolchain (clang 4.0.1 for pi32v2)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three of its files go into the package)
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Host tests (the groove engine, the screen, the generated files)
        run: sh tests/si_tests.sh

      - name: Build Sill
        # On a failure the compiler's errors and the log's tail become annotations: readable through the API
        # (check runs), where the raw log is not always reachable.
        run: |
          mkdir -p build
          set -o pipefail
          if FELUCCA_SILL=1 ./build.sh 2>&1 | tee build/build.log; then exit 0; fi
          grep -E 'error:|undefined reference|overflow|No space|Error [0-9]' build/build.log | head -8 | while IFS= read -r l; do
            echo "::error title=build::$l"
          done
          tail -n 40 build/build.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > build/tail.txt
          echo "::error title=build log (last 40 lines)::$(cat build/tail.txt)"
          exit 1

      - name: No soft-float routines (Sill's floats run on the FPU; a routine like __mulsf3 here crashed an FM-1 running Tuna)
        run: |
          if grep -E '\s__(add|sub|mul|div|neg)[sd]f3$|\s__(fix|float|extend|trunc)\w*[sd]f\w*$|\s__(eq|ne|lt|le|gt|ge|unord)[sd]f2$' build/felucca.sym; then
            echo "soft-float routines in the firmware: build with -mcpu=r3 -mfprev1 (tools/build.py)"; exit 1
          fi
          echo "none"

      - name: Sizes (each object's code, constants and RAM, its largest symbols; also when the link fails)
        if: always()
        run: |
          NM=$(find "$HOME/.jieli/toolchain/" -name "*nm" -type f -perm -u+x | head -1)
          echo "nm: $NM"
          for o in build/felucca.o build/si_*.o build/tuna_*.o; do
            [ -f "$o" ] || continue
            "$NM" --size-sort -S "$o" > "$o.sizes" || continue
            python3 - "$o" <<'PY'
          import sys
          tot = {}
          rows = []
          for line in open(sys.argv[1] + ".sizes"):
              f = line.split()
              if len(f) == 4:
                  k = {"t": "code", "r": "const", "d": "data", "b": "bss", "s": "bss"}.get(f[2].lower(), f[2])
                  tot[k] = tot.get(k, 0) + int(f[1], 16)
                  rows.append((int(f[1], 16), k, f[3]))
          print("==", sys.argv[1], "  ".join(f"{k} {v}" for k, v in sorted(tot.items())))
          for n, k, name in sorted(rows)[-15:][::-1]:
              print(f"   {n:7d} {k:5s} {name}")
          PY
          done

      - name: Name the package
        run: |
          mkdir -p dist
          FV=$(sed -n 's/^#define SI_VERSION "\([^"]*\)".*/\1/p' firmware/src/si_version.h)
          DEV=$([ "$GITHUB_REF_NAME" = main ] || echo "-$GITHUB_REF_NAME")
          cp build/felucca.fwsc "dist/sill-$FV$DEV-${GITHUB_SHA::7}.fwsc"
          cp LICENSE LICENSING.md dist/
          cp -r LICENSES dist/
          mkdir -p dist/debug                 # for a crash screen: its PC in the symbols and the disassembly
          cp build/felucca.sym dist/debug/ && gzip -c build/felucca.dis > dist/debug/felucca.dis.gz
          ls -l dist dist/debug

      - uses: actions/upload-artifact@v4
        with:
          name: sill-firmware
          path: dist/

      - name: Clang's WASI sysroot (for Sill in the browser; npm's @yowasp/clang carries one)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        continue-on-error: true            # (the site goes out without it)
        run: |
          sudo apt-get install -y lld
          mkdir -p "$HOME/wasi" && cd "$HOME/wasi"
          npm pack @yowasp/clang
          mkdir -p pkg sys && tar -xzf yowasp-clang-*.tgz -C pkg && tar -xf pkg/package/gen/llvm-resources.tar -C sys

      - name: Sill in the browser (the same firmware, WebAssembly)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        continue-on-error: true            # (the site goes out without it)
        run: |
          WASI_SYSROOT="$HOME/wasi/sys" sh web/emu/si_build.sh
          node web/emu/si_emu_test.mjs build/si_emu/sill.wasm

      - name: The other branch (the site carries main's release at its root and dev's test build under dev/)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        continue-on-error: true            # (the site goes out with this branch only)
        run: |
          OTHER=$([ "$GITHUB_REF_NAME" = main ] && echo dev || echo main)
          git fetch --depth 1 origin "$OTHER"
          OSHA=$(git rev-parse FETCH_HEAD)
          if [ "$OSHA" = "$GITHUB_SHA" ]; then
            cp build/felucca.fwsc build/other.fwsc
            [ -d build/si_emu ] && rm -rf build/other_emu && cp -r build/si_emu build/other_emu
          else
            git worktree add ../other "$OSHA"
            (cd ../other && git submodule update --init --depth 1 && FELUCCA_SILL=1 ./build.sh)
            cp ../other/build/felucca.fwsc build/other.fwsc
            # its browser build too, so its pages keep their try/ (the site goes out without it if this fails)
            if [ -d "$HOME/wasi/sys" ] && (cd ../other && WASI_SYSROOT="$HOME/wasi/sys" sh web/emu/si_build.sh); then
              rm -rf build/other_emu && cp -r ../other/build/si_emu build/other_emu
            fi
          fi
          echo "OTHER=$OTHER" >> "$GITHUB_ENV"
          echo "OSHA=${OSHA::7}" >> "$GITHUB_ENV"

      - name: The site (main's release at the root, dev's test build under dev/, each with its installer)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then MAIN=build/felucca.fwsc MS=${GITHUB_SHA::7} DEV=build/other.fwsc DS=$OSHA
          else MAIN=build/other.fwsc MS=$OSHA DEV=build/felucca.fwsc DS=${GITHUB_SHA::7}; fi
          # (try/: each branch's own browser build, build/si_emu for the branch pushed, build/other_emu for the other)
          if [ "$GITHUB_REF_NAME" = main ]; then ME=build/si_emu DE=build/other_emu; else ME=build/other_emu DE=build/si_emu; fi
          if [ -f "$DEV" ]; then SI_EMU_DIR=$DE python3 web/si_make_site.py "$DEV" "dev-$DS" _site/dev; fi
          if [ -f "$MAIN" ]; then SI_EMU_DIR=$ME python3 web/si_make_site.py "$MAIN" "$MS" _site
          else python3 web/si_make_site.py --waiting _site; fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        with:
          path: _site

  pages:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: build
    concurrency:                          # a push to main and to dev at once: one deploy after the other
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
